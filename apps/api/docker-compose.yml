services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sabli
      POSTGRES_USER: ${SABLI_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SABLI_DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d sabli"]
      interval: 5s
      timeout: 5s
      retries: 10
