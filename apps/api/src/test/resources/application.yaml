spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

sabli:
  cors:
    allowed-origins: http://127.0.0.1:5173
  identity:
    registration:
      mode: OPEN
    lockout:
      max-attempts: 5
      duration: PT15M
  security:
    jwt:
      secret: integration-test-jwt-secret-key-32ch
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    password-encoder-strength: 4
