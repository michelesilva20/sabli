name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npx vitest run
      - name: Build
        run: npm run build

  e2e:
    name: Playwright (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
        env:
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

  integration:
    name: Playwright (real API)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sabli
          POSTGRES_USER: sabli
          POSTGRES_PASSWORD: sabli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sabli -d sabli"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SABLI_E2E_API: http://127.0.0.1:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sabli
      SPRING_DATASOURCE_USERNAME: sabli
      SPRING_DATASOURCE_PASSWORD: sabli
      SABLI_JWT_SECRET: integration-ci-jwt-secret-key-32ch
      SABLI_REGISTRATION_MODE: OPEN
      SABLI_BCRYPT_STRENGTH: "4"
      SABLI_COOKIE_SECURE: "false"
      SABLI_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4175
      VITE_SABLI_MODE: api
      VITE_SABLI_API_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Package API
        working-directory: apps/api
        run: ./mvnw -B -DskipTests package
        env:
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: Start API
        working-directory: apps/api
        run: |
          nohup java -jar target/sabli-api-0.1.0-SNAPSHOT.jar > /tmp/sabli-api.log 2>&1 &
          echo $! > /tmp/sabli-api.pid
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          echo "API não subiu"
          cat /tmp/sabli-api.log
          exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Playwright against real API
        run: npx playwright test -c playwright.real.config.ts
      - name: API log on failure
        if: failure()
        run: cat /tmp/sabli-api.log || true
