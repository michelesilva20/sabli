name: sabli

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SABLI_POSTGRES_DB:-sabli}
      POSTGRES_USER: ${SABLI_POSTGRES_USER:-sabli}
      POSTGRES_PASSWORD: ${SABLI_POSTGRES_PASSWORD:-sabli}
    ports:
      - "${SABLI_POSTGRES_PORT:-5435}:5432"
    volumes:
      - sabli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sabli_pgdata:
